<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="visor-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-cyber)" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Hoodie Shoulder / Torso -->
  <path d="M 22 110 C 22 84 38 72 60 72 C 82 72 98 84 98 110 Z" fill="#090d16" stroke="#1e293b" stroke-width="2" />
  <path d="M 40 76 L 60 110 L 80 76 Z" fill="#0284c7" opacity="0.3" />
  
  <!-- Hoodie Head Outline -->
  <ellipse cx="60" cy="54" rx="28" ry="32" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Face Shadow Inside Hoodie -->
  <ellipse cx="60" cy="56" rx="20" ry="22" fill="#030712" />
  
  <!-- Glowing Cyber Visor -->
  <rect x="42" y="50" width="36" height="11" rx="4" fill="url(#visor-cyan)" filter="url(#glow-cyan)" />
  <line x1="44" y1="55" x2="76" y2="55" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
  
  <!-- Mask Details / Cyber Grid Lines -->
  <path d="M 52 70 L 60 75 L 68 70" stroke="#06b6d4" stroke-width="2" fill="none" stroke-linecap="round" />
  <circle cx="46" cy="68" r="1.5" fill="#38bdf8" />
  <circle cx="74" cy="68" r="1.5" fill="#38bdf8" />
  
  <!-- Neon Tech Accents -->
  <line x1="28" y1="36" x2="36" y2="44" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
  <line x1="92" y1="36" x2="84" y2="44" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" stroke-linecap="round" />
</svg>
