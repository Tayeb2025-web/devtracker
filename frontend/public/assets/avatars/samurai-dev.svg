      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg-samurai)" stroke="#f87171" stroke-width="2.5" />
  
