<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-astro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="gold-visor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg-astro)" stroke="#818cf8" stroke-width="2.5" />
  
  <!-- Tiny Background Stars -->
  <circle cx="30" cy="30" r="1" fill="#ffffff" opacity="0.7" />
  <circle cx="90" cy="25" r="1.2" fill="#ffffff" opacity="0.8" />
  <circle cx="20" cy="70" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="102" cy="78" r="1.2" fill="#ffffff" opacity="0.7" />
  
  <!-- Spacesuit Shoulders -->
  <path d="M 22 110 C 22 84 36 74 60 74 C 84 74 98 84 98 110 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <rect x="48" y="86" width="24" height="18" rx="4" fill="#3b82f6" />
  <circle cx="54" cy="95" r="2" fill="#ef4444" />
  <circle cx="66" cy="95" r="2" fill="#10b981" />
  
  <!-- Helmet Base -->
  <circle cx="60" cy="50" r="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5" />
  
  <!-- Reflective Gold Visor -->
  <rect x="40" y="38" width="40" height="25" rx="10" fill="url(#gold-visor)" stroke="#b45309" stroke-width="1.5" />
  
  <!-- Visor Flare / Glare -->
  <path d="M 46 42 Q 60 40 70 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
  
  <!-- Antenna -->
  <line x1="60" y1="22" x2="60" y2="12" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="60" cy="11" r="3" fill="#ef4444" />
</svg>
