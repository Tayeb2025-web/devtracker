<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-ninja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2b" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#bg-ninja)" stroke="#c084fc" stroke-width="2.5" />
  
  <!-- Ninja Shoulders -->
  <path d="M 22 110 C 22 84 38 72 60 72 C 82 72 98 84 98 110 Z" fill="#0f071a" stroke="#2e1065" stroke-width="2" />
  <path d="M 45 76 L 60 100 L 75 76 Z" fill="#a855f7" opacity="0.35" />
  
  <!-- Ninja Head Wrap -->
  <circle cx="60" cy="52" r="26" fill="#090314" stroke="#a855f7" stroke-width="1.8" />
  
  <!-- Headband / Metal Plate -->
  <path d="M 36 42 C 44 40 76 40 84 42 L 83 48 C 75 46 45 46 37 48 Z" fill="#c084fc" />
  <polygon points="60,43 64,46 60,49 56,46" fill="#ffffff" />
  
  <!-- Glowing Ninja Eyes -->
  <polygon points="44,55 54,57 46,60" fill="#f43f5e" filter="url(#glow-purple)" />
  <polygon points="76,55 66,57 74,60" fill="#f43f5e" filter="url(#glow-purple)" />
  
  <!-- Face Mask Band -->
  <path d="M 40 62 C 40 72 80 72 80 62 Z" fill="#1e0c38" stroke="#a855f7" stroke-width="1.2" />
  
  <!-- Ninja Ribbons / Ties -->
  <path d="M 84 44 Q 96 46 100 58 Q 96 52 86 48 Z" fill="#c084fc" opacity="0.8" />
</svg>
