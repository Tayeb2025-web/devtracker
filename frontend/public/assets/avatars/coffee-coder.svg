<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-coffee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#271a0c" />
      <stop offset="50%" stop-color="#54371a" />
      <stop offset="100%" stop-color="#84532b" />
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg-coffee)" stroke="#d97706" stroke-width="2.5" />
  
  <!-- Hoodie Body -->
  <path d="M 22 110 C 22 84 38 74 60 74 C 82 74 98 84 98 110 Z" fill="#3b2d20" stroke="#78350f" stroke-width="2" />
  
  <!-- Head & Beanie -->
  <circle cx="60" cy="54" r="22" fill="#fed7aa" />
  <!-- Knit Beanie -->
  <path d="M 38 46 C 38 28 82 28 82 46 Z" fill="#b45309" stroke="#92400e" stroke-width="2" />
  <rect x="36" y="44" width="48" height="8" rx="3" fill="#d97706" />
  <circle cx="60" cy="28" r="4" fill="#f59e0b" />
  
  <!-- Stylish Thick Glasses -->
  <rect x="44" y="50" width="14" height="10" rx="3" fill="none" stroke="#1f2937" stroke-width="2.2" />
  <rect x="62" y="50" width="14" height="10" rx="3" fill="none" stroke="#1f2937" stroke-width="2.2" />
  <line x1="58" y1="54" x2="62" y2="54" stroke="#1f2937" stroke-width="2.2" />
  <circle cx="51" cy="55" r="2" fill="#1f2937" />
  <circle cx="69" cy="55" r="2" fill="#1f2937" />
  
  <!-- Beard / Smile -->
  <path d="M 52 64 C 52 70 68 70 68 64 Z" fill="#78350f" />
  
  <!-- Steaming Coffee Cup -->
  <g transform="translate(68, 76)">
    <rect x="0" y="8" width="18" height="20" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <path d="M 18 12 Q 24 16 18 20" fill="none" stroke="#ffffff" stroke-width="2" />
    <!-- Heart on Cup -->
    <path d="M 9 16 C 9 14 7 13 6 14 C 4 15 5 18 9 21 C 13 18 14 15 12 14 C 11 13 9 14 9 16 Z" fill="#ef4444" transform="scale(0.8) translate(2,2)" />
    <!-- Steam Lines -->
    <path d="M 5 4 Q 7 1 5 -2" stroke="#fcd34d" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <path d="M 11 5 Q 13 2 11 -1" stroke="#fcd34d" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>
</svg>
